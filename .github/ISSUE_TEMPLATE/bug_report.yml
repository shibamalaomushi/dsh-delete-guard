name: Bug 报告
description: 报告插件的缺陷（界面、删除行为、兼容性等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的信息。

        **请勿粘贴会话正文、工作区私有路径或任何凭据。** 涉及误删/越权等安全问题，请改用
        仓库 Security → Report a vulnerability 私下报告（见 SECURITY.md）。
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 运行 `dsh --version`，或桌面端「关于」里的版本号
      placeholder: 0.2.0-rc.2
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: 运行形态
      options:
        - 桌面端（DeepSeek Harness 应用）
        - dsh web（浏览器访问本地端口）
        - 其它（请在补充信息里说明）
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: package.json 里的 version，或侧边栏「会话管理」页面显示的版本
      placeholder: 1.3.1
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 你做了什么、期望什么、实际发生了什么；如果有报错原文请一并贴出（注意去掉个人路径）
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开侧边栏「会话管理」
        2. 对某条空闲会话点击「删除」
        3. 看到……
    validations:
      required: true
  - type: input
    id: audit-log
    attributes:
      label: 审计日志（可选）
      description: 相关行来自 <DSH_HOME>/session-manager/log.jsonl；贴之前请删掉个人路径与会话标题
      placeholder: '{"at":"…","action":"trash","sessionId":"session-…"}'
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认贴出的内容不含个人路径、会话正文或凭据
          required: true
        - label: 我已在最新版本上复现（升级需要先卸载再安装）
          required: true
