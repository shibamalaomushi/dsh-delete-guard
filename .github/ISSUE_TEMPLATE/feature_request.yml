name: 功能建议
description: 提议一个新能力或行为改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个插件的目标是**安全地删除单条会话**。与"删除安全性"直接相关的建议优先；
        与插件职责无关的建议（例如改内核行为）可能不适合放在这里。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述现在的痛点，而不是直接给出实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的行为
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 对安全性的影响
      description: 该建议会不会让"误删/越权/不可恢复"变得更容易发生？如果会，你认为需要什么额外防线？
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
    validations:
      required: false
