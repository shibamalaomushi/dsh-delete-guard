name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # DSH 0.2.2 的最低 Node.js 版本是 24.9；插件跟随宿主基线。
        node: ['24.9', '24']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 本项目零依赖，不需要 install；NODE_ENV 只影响 npm 自身的提示。
      - name: 端到端自测 / 静态审计 / 敏感信息扫描
        run: npm test
        env:
          NODE_ENV: test
